name: Action validation

on:
  pull_request: {}
  push: {}
  workflow_dispatch: {}
  merge_group: {}

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}
      source: ${{ steps.manifest.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module .\scripts\Tools.psm1
          $manifest = Read-ActionManifest -Path .\release.json
          "matrix=$(@{ include = @($manifest.targets) } | ConvertTo-Json -Compress -Depth 5)" >> $env:GITHUB_OUTPUT
          $source = (Get-Content .\.github\monorepo-revision -Raw).Trim()
          if ($source -cnotmatch '^[0-9a-f]{40}$') { throw 'Source canaries require an exact monorepo commit.' }
          "source=$source" >> $env:GITHUB_OUTPUT

  pester:
    name: Pester (${{ matrix.runner }})
    needs: setup
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run fast isolated tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -EQ 5.7.1)) {
            Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          }
          if (-not (Get-Module -ListAvailable powershell-yaml | Where-Object Version -EQ 0.4.12)) {
            Install-Module powershell-yaml -RequiredVersion 0.4.12 -Scope CurrentUser -Force
          }
          Import-Module Pester -RequiredVersion 5.7.1
          $result = Invoke-Pester -Path .\tests -PassThru -Output Detailed
          if ($result.Result -ne 'Passed') { throw 'Pester failed.' }

  version-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Feature pushes must not mistake their own pending increment for a release.
      # Ref: docs/implementation.md#version-readiness-and-reconciliation.
      - name: Check version against the release baseline and immutable tags
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Import-Module .\scripts\Release.psm1 -Force
          $workflowEvent = Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json -AsHashtable
          $base = Get-ValidationReleaseBase -EventName $env:GITHUB_EVENT_NAME `
            -EventData $workflowEvent -Ref $env:GITHUB_REF
          & .\scripts\Publish-Release.ps1 -CheckOnly -BaseRef $base

  path-collect:
    # Each independent platform pair owns a distinct project in the run-wide job
    # inventory. Fixture configuration and receipt checks use this same identity.
    name: cbh-collect:action-canary-${{ matrix.runner }}:${{ matrix.runner }}
    needs: setup
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      CBH_ACTION_DISABLE_CACHE: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout exact canary source
        uses: actions/checkout@v7
        with:
          repository: folo-rs/folo
          ref: ${{ needs.setup.outputs.source }}
          path: Folo
          persist-credentials: false
      # Pin reviewed master code independently of the compiler channel.
      # Ref: docs/implementation.md, "CI evidence".
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - name: Prepare isolated synthetic benchmark fixture
        id: fixture
        shell: pwsh
        env:
          CANARY_INSTANCE: action-canary-${{ matrix.runner }}
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'Folo'
          "source=$source" >> $env:GITHUB_OUTPUT
          $root = Join-Path $env:RUNNER_TEMP "source-smoke-$([guid]::NewGuid().ToString('N'))"
          & .\tests\Initialize-Canary.ps1 -Root $root -Method path -SourcePath $source -ProjectId $env:CANARY_INSTANCE
      - name: Collect with source-built tools
        id: collect
        uses: ./
        with:
          command: collect
          install-method: path
          source-path: ${{ steps.fixture.outputs.source }}
          working-directory: ${{ steps.fixture.outputs.workspace }}
          local-path: ${{ steps.fixture.outputs.store }}
          bench: synthetic
          collection-snapshot: 'true'
          on-existing: skip
      - name: Backfill and resume on the collection runner
        id: backfill
        if: steps.collect.outputs.skipped != 'true'
        shell: pwsh
        env:
          CANARY_WORKSPACE: ${{ steps.fixture.outputs.workspace }}
          CANARY_STORE: ${{ steps.fixture.outputs.store }}
          CANARY_KEY: ${{ steps.collect.outputs.machine-key }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CANARY_KEY)) { throw 'Collection emitted no machine key.' }
          & .\tests\Invoke-BackfillCanary.ps1 -Workspace $env:CANARY_WORKSPACE `
            -Store $env:CANARY_STORE -MachineKey $env:CANARY_KEY
      - name: Record the exact collection and preserve its local baseline fixture
        id: evidence
        shell: pwsh
        env:
          CANARY_ROOT: ${{ steps.fixture.outputs.root }}
          CANARY_WORKSPACE: ${{ steps.fixture.outputs.workspace }}
          CANARY_PLATFORM: ${{ matrix.runner }}
          CANARY_INSTANCE: action-canary-${{ matrix.runner }}
          CANARY_COLLECTION: ${{ toJSON(steps.collect.outputs) }}
        run: |
          $ErrorActionPreference = 'Stop'
          . .\tests\Invoke-BackfillCanary.ps1
          Import-Module .\scripts\Workflow.psm1
          $collection = $env:CANARY_COLLECTION | ConvertFrom-Json -AsHashtable
          $head = & git -C $env:CANARY_WORKSPACE rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify the collected fixture head.' }
          $receipt = Join-Path $env:CANARY_ROOT 'receipt.json'
          if ($collection['skipped'] -cne 'true') {
            if ($collection['instance'] -cne $env:CANARY_INSTANCE) { throw 'Canary job marker disagrees with the canonical project.' }
            $companion = Get-CanaryCollectionTool -Workspace $env:CANARY_WORKSPACE -TemporaryDirectory $env:RUNNER_TEMP -Role companion
            $context = @{ companion = $companion; 'receipt-file' = $receipt }
            Invoke-WorkflowOperation receipt $context -Instance $collection['instance'] -Head $head `
              -Platform $env:CANARY_PLATFORM -CollectionFile $collection['collection-file']
          } else {
            New-Item -ItemType Directory -Path (Join-Path $env:CANARY_ROOT 'store') -Force | Out-Null
          }
          @{ head = $head; collection = $collection } | ConvertTo-Json -Depth 5 |
            Set-Content -LiteralPath (Join-Path $env:CANARY_ROOT 'metadata.json')
          $archive = Join-Path $env:CANARY_ROOT 'fixture.tar'
          # Preserve the fixture Git directory without transporting installations or build outputs.
          $arguments = @('-cf', $archive, '-C', $env:CANARY_ROOT, 'workspace', 'store', 'metadata.json')
          & tar @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Cannot archive the source canary fixture.' }
          "receipt=$receipt" >> $env:GITHUB_OUTPUT
          "fixture=$archive" >> $env:GITHUB_OUTPUT
      - name: Upload immutable collection-attempt evidence
        if: steps.collect.outputs.skipped != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: canary-source-receipt-${{ matrix.rust_target }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.receipt }}
          if-no-files-found: error
      - name: Upload the portable baseline fixture
        uses: actions/upload-artifact@v7
        with:
          # Only the supporting fixture is replaceable on a retry. Collection
          # receipts retain every attempt and remain the current-data authority.
          name: canary-source-fixture-${{ matrix.rust_target }}
          overwrite: true
          path: ${{ steps.evidence.outputs.fixture }}
          if-no-files-found: error

  path-smoke:
    name: Source path (${{ matrix.runner }})
    needs: [setup, path-collect]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      CBH_ACTION_DISABLE_CACHE: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout exact canary source
        uses: actions/checkout@v7
        with:
          repository: folo-rs/folo
          ref: ${{ needs.setup.outputs.source }}
          path: Folo
          persist-credentials: false
      # Match the collection compiler channel and reviewed bootstrap implementation.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - name: Download the selected platform's portable fixture
        uses: actions/download-artifact@v8
        with:
          name: canary-source-fixture-${{ matrix.rust_target }}
          path: ${{ runner.temp }}/source-canary
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: Restore the measured checkout and baseline store
        id: fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'source-canary'
          $arguments = @('-xf', (Join-Path $root 'fixture.tar'), '-C', $root)
          & tar @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Cannot restore the source canary fixture.' }
          $metadata = Get-Content -LiteralPath (Join-Path $root 'metadata.json') -Raw | ConvertFrom-Json -AsHashtable
          $workspace = Join-Path $root 'workspace'
          $head = & git -C $workspace rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cne $metadata.head) { throw 'Restored fixture head disagrees with its collection.' }
          "source=$(Join-Path $env:GITHUB_WORKSPACE 'Folo')" >> $env:GITHUB_OUTPUT
          "root=$root" >> $env:GITHUB_OUTPUT
          "workspace=$workspace" >> $env:GITHUB_OUTPUT
          "store=$(Join-Path $root 'store')" >> $env:GITHUB_OUTPUT
          "head=$head" >> $env:GITHUB_OUTPUT
          "skipped=$($metadata.collection['skipped'])" >> $env:GITHUB_OUTPUT
          "instance=$($metadata.collection['instance'])" >> $env:GITHUB_OUTPUT
          "machine-key=$($metadata.collection['machine-key'])" >> $env:GITHUB_OUTPUT
          "collection-json=$($metadata.collection | ConvertTo-Json -Compress)" >> $env:GITHUB_OUTPUT
          if ($metadata.collection['skipped'] -ceq 'true') {
            # Keep scoped input syntax valid for the fork gate, without claiming
            # any collected evidence or providing a nonfork reconciliation fallback.
            $skippedCollections = Join-Path $root 'skipped-current-collections'
            New-Item -ItemType Directory -Path $skippedCollections | Out-Null
            "skipped-collections=$skippedCollections" >> $env:GITHUB_OUTPUT
          }
      - name: Download every collection attempt for this platform
        if: steps.fixture.outputs.skipped != 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: canary-source-receipt-${{ matrix.rust_target }}-*
          path: ${{ steps.fixture.outputs.root }}/receipts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: Reconcile actual completed collection jobs
        id: collection
        if: steps.fixture.outputs.skipped != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANARY_ROOT: ${{ steps.fixture.outputs.root }}
          CANARY_WORKSPACE: ${{ steps.fixture.outputs.workspace }}
          CANARY_SOURCE: ${{ steps.fixture.outputs.source }}
          CANARY_HEAD: ${{ steps.fixture.outputs.head }}
          CANARY_PLATFORM: ${{ matrix.runner }}
          CANARY_INSTANCE: ${{ steps.fixture.outputs.instance }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module .\scripts\Workflow.psm1
          Import-Module .\scripts\Tools.psm1
          $context = @{
            'working-directory' = $env:CANARY_WORKSPACE
            'install-method' = 'path'; 'source-path' = $env:CANARY_SOURCE; base = ''
            'tools-root' = Join-Path $env:CANARY_ROOT 'workflow-tools'
            'receipts-directory' = Join-Path $env:CANARY_ROOT 'receipts'
            'current-collection-directory' = Join-Path $env:CANARY_ROOT 'current-collections'
          }
          $tools = Install-WorkflowTool $context (Read-ActionManifest .\release.json)
          $context.companion = $tools.companion
          Invoke-WorkflowOperation reconcile $context -Instance $env:CANARY_INSTANCE `
            -Head $env:CANARY_HEAD -Platforms $env:CANARY_PLATFORM
      - name: Analyze with source-built tools
        id: analyze
        uses: ./
        with:
          command: analyze-history
          install-method: path
          source-path: ${{ steps.fixture.outputs.source }}
          working-directory: ${{ steps.fixture.outputs.workspace }}
          local-path: ${{ steps.fixture.outputs.store }}
          current-collections: ${{ steps.fixture.outputs.skipped == 'true' && steps.fixture.outputs.skipped-collections || steps.collection.outputs.current-collections }}
          # Include the fixed-date synthetic fixture, independently of the live clock.
          since: '2000-01-01'
          context: HEAD
          expected-platforms: ${{ matrix.runner }}
          # This single-platform canary reaches analysis only after successful
          # reconciliation or an explicit fork policy skip.
          completed-platforms: ${{ matrix.runner }}
      - name: Verify real collection and honest reports
        shell: pwsh
        env:
          CANARY_WORKSPACE: ${{ steps.fixture.outputs.workspace }}
          CANARY_STORE: ${{ steps.fixture.outputs.store }}
          CANARY_KEY: ${{ steps.fixture.outputs.machine-key }}
          CANARY_COLLECTION: ${{ steps.fixture.outputs.collection-json }}
          CANARY_ANALYSIS: ${{ toJSON(steps.analyze.outputs) }}
        run: |
          & .\tests\Assert-Canary.ps1 -Workspace $env:CANARY_WORKSPACE -Store $env:CANARY_STORE `
            -MachineKey $env:CANARY_KEY -CollectionJson $env:CANARY_COLLECTION -AnalysisJson $env:CANARY_ANALYSIS
      - name: Upload emitted reports through the consumer artifact action
        id: upload-reports
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' && steps.analyze.outputs.skipped != 'true' }}
        # The final assertion requires an upload; only this attempt may recover.
        # Ref: docs/implementation.md, "CI evidence".
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: canary-reports-path-${{ matrix.rust_target }}-${{ github.run_attempt }}
          if-no-files-found: error
          # Pass paths unchanged so the actual consumer validates platform path handling.
          path: |
            ${{ steps.analyze.outputs.report-markdown }}
            ${{ steps.analyze.outputs.report-json }}
            ${{ steps.analyze.outputs.report-summary }}
      - name: Retry emitted report upload
        id: upload-reports-retry
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' && steps.analyze.outputs.skipped != 'true' && steps.upload-reports.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          # A failed finalization can leave an artifact with the original name.
          name: canary-reports-path-${{ matrix.rust_target }}-${{ github.run_attempt }}-retry
          if-no-files-found: error
          path: |
            ${{ steps.analyze.outputs.report-markdown }}
            ${{ steps.analyze.outputs.report-json }}
            ${{ steps.analyze.outputs.report-summary }}
      - name: Require a successful report upload
        id: require-report-upload
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' && steps.analyze.outputs.skipped != 'true' }}
        shell: pwsh
        env:
          CANARY_UPLOAD_OUTCOME: ${{ steps.upload-reports.outcome }}
          CANARY_RETRY_OUTCOME: ${{ steps.upload-reports-retry.outcome }}
        run: |
          if ($env:CANARY_UPLOAD_OUTCOME -cne 'success' -and $env:CANARY_RETRY_OUTCOME -cne 'success') {
            throw "Report upload did not succeed: initial=$env:CANARY_UPLOAD_OUTCOME, retry=$env:CANARY_RETRY_OUTCOME"
          }
          if ($env:CANARY_UPLOAD_OUTCOME -ceq 'failure' -and $env:CANARY_RETRY_OUTCOME -ceq 'success') {
            Write-Output '::warning::Canary report artifact upload recovered on retry; see the initial upload step for diagnostics.'
          }

  availability:
    uses: ./.github/workflows/install-tools.yml

  install-tools:
    name: install-tools
    if: always()
    needs: availability
    runs-on: ubuntu-latest
    steps:
      - name: Require every real installation canary
        shell: pwsh
        env:
          AVAILABILITY_RESULT: ${{ needs.availability.result }}
        run: |
          if ($env:AVAILABILITY_RESULT -cne 'success') {
            throw "Published tool availability did not pass: $env:AVAILABILITY_RESULT"
          }
